name: docker

on:
  workflow_dispatch:
  push:
    tags: [v*]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BUILD_PROFILE=release
          tags: ghcr.io/local-xyz/grid-relay:${{ steps.version.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/local-xyz/relay
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/local-xyz/grid-relay@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
