name: docker

on:
  workflow_dispatch:
  push:
    tags: [v*]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/relay-image.tar
          build-args: BUILD_PROFILE=release
          tags: |
            ghcr.io/local-xyz/relay:${{ steps.version.outputs.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/local-xyz/relay:{0}', github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/local-xyz/relay
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save candidate for verification and manual publishing
        uses: actions/upload-artifact@v4
        with:
          name: relay-image-${{ github.sha }}
          path: /tmp/relay-image.tar
          compression-level: 0
          retention-days: 3
      - name: Publish candidate
        env:
          IMAGE: ghcr.io/local-xyz/relay:${{ steps.version.outputs.sha }}
          VERSION_IMAGE: ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/local-xyz/relay:{0}', github.ref_name) || '' }}
        run: |
          docker load --input /tmp/relay-image.tar
          docker push "$IMAGE"
          if [ -n "$VERSION_IMAGE" ]; then docker push "$VERSION_IMAGE"; fi
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
