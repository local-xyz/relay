name: docker

on:
  workflow_dispatch:
  push:
    tags: [v*]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/local-xyz/relay

jobs:
  # One native build per platform. Emulating arm64 under QEMU on an amd64 runner
  # took more than 90 minutes for the release profile; a native arm runner
  # builds it in the same time as amd64. Each job pushes its image by digest
  # only; `publish` assembles the tagged multi-arch index from the two digests.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: BUILD_PROFILE=release
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/local-xyz/relay
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A `v*` tag publishes `<tag>`, `latest`, and the short commit.
      # A manual run publishes only the short commit as a candidate.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Create the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          test "$(ls | wc -l)" -eq 2
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Summary
        run: |
          first=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          {
            echo '```'
            printf '%s\n' "${{ steps.meta.outputs.tags }}"
            docker buildx imagetools inspect "$first" | sed -n '1,3p;/Manifests:/,$p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
